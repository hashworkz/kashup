spring.application.name=kashish-vivid-app
server.port=${PORT:8085}

# PostgreSQL Database (Default to Supabase PostgreSQL, fallback via DB_URL)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.myzvyzvxesjiftqzwfwj.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:harshit@kash12}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable scheduling for 2-day message auto-purge
spring.task.scheduling.pool.size=2

# Static resources mapping for SPA React
spring.web.resources.add-mappings=true
