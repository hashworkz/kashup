spring.application.name=kashish-vivid-app
server.port=${PORT:8085}

# Datasource configuration (Defaults to H2 in-memory PostgreSQL mode for 100% reliable cloud startup)
spring.datasource.url=${DB_URL:jdbc:h2:mem:kashishdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:harshit@kash12}

# HikariCP fail-safe: ensures Tomcat binds to $PORT instantly on Render
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate settings (Spring Boot auto-detects dialect and driver matching the URL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable scheduling for 2-day message auto-purge
spring.task.scheduling.pool.size=2

# Static resources mapping for SPA React
spring.web.resources.add-mappings=true
