spring.application.name=kashish-vivid-app
server.port=${PORT:8085}

# PostgreSQL Database (Configured for Supabase PostgreSQL and H2 compatibility)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.myzvyzvxesjiftqzwfwj.supabase.co:6543/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:harshit@kash12}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# HikariCP: Prevent application startup crash if database is unreachable (allows instant Tomcat port detection)
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate settings
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable scheduling for 2-day message auto-purge
spring.task.scheduling.pool.size=2

# Static resources mapping for SPA React
spring.web.resources.add-mappings=true
