spring.application.name=kashish-vivid-app
server.port=${PORT:8085}

# Datasource configuration (Defaults to H2 PostgreSQL mode; configurable via env vars)
spring.datasource.url=${DB_URL:jdbc:h2:mem:kashishdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:harshit@kash12}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Explicitly declare dialect so Hibernate never fails metadata resolution
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable scheduling for 2-day message auto-purge
spring.task.scheduling.pool.size=2

# Static resources mapping for SPA React
spring.web.resources.add-mappings=true
