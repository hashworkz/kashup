spring.application.name=kashish-vivid-app
server.port=${PORT:8085}

# PostgreSQL / Supabase Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://db.myzvyzvxesjiftqzwfwj.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:harshit@kash12}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly disable metadata probing so Hibernate starts Tomcat in 2 seconds without hanging
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP fail-safe initialization
spring.datasource.hikari.initialization-fail-timeout=0

# Enable scheduling for 2-day message auto-purge
spring.task.scheduling.pool.size=2

# Static resources mapping for SPA React
spring.web.resources.add-mappings=true
